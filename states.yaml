  source: "WIMS src/Interfaces/common.c (prepare1, putparm, readresult), pari.c, maxima.c"
  wims: "random 'Start line <prog> r1..r4' / 'End line ...' markers printed via stringprinter (PARI print(\"%s\"), Maxima \"%s\";) around the command; readresult keeps only text after the LAST start marker up to the end marker, then output()"
