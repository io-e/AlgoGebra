wims_root_cause_BUG-001_BUG-002:
  source: "WIMS src/Interfaces/common.c (prepare1, putparm, readresult), pari.c, maxima.c"
  wims: "random 'Start line <prog> r1..r4' / 'End line ...' markers printed via stringprinter (PARI print(\"%s\"), Maxima \"%s\";) around the command; readresult keeps only text after the LAST start marker up to the end marker, then output()"
  port: "PariGPEngine/MaximaEngine.prepareRequest send header+command with no markers; parseOutput keeps all header results"
  headers: "identical to WIMS (not the cause)"
  other_diffs: "PARI port adds setrand + \\e1; WIMS sets GPRC=../.gprc; WIMS Maxima lowercases input/output and appends ';'"
  fix_proposal: "port putparm/readresult marker logic into SubprocessEngine; keep existing parsers on the extracted slice (not applied)"

